# End-to-end tests (Playwright, chromium)
#
# CI starts an isolated local Supabase stack and applies every migration.
# Tests must never create anonymous users or gameplay rows in production.
#
# @stripe-tagged tests (real Stripe checkout) are always excluded here;
# run them locally with E2E_STRIPE=1 npx playwright test --grep @stripe

name: E2E

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  sql-contracts:
    name: isolated SQL contracts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1
      - name: Start clean isolated Supabase
        run: |
          supabase start --exclude realtime,storage-api,imgproxy,postgres-meta,studio,edge-runtime,logflare,vector,supavisor,mailpit
          supabase db reset --local
      - name: Run ordinary and two-connection SQL contracts
        run: bash scripts/run-local-sql-contracts.sh
      - name: Stop isolated Supabase
        if: always()
        run: supabase stop --no-backup

  # FOUR FLAG SHAPES: two full suites plus two narrow independent rollbacks.
  #
  # Until 2026-07-27 this job passed no NEXT_PUBLIC_* flag at all, so every
  # flag-split spec ran its flag-OFF branch - while production runs all of them
  # ON. The shipped path had jest coverage and no browser coverage whatsoever.
  # CLAUDE.md already warned about this ("test rollback paths deliberately;
  # never let CI infer them from an omitted flag"); this is that failure in the
  # other direction, where the inferred branch was the one players don't get.
  #
  # `rollback` keeps historical all-off coverage. `production` mirrors the live
  # environment. Workbench and Genome have independent rollback switches, so
  # their two mixed states run the focused public Research journey. The
  # aggregate job below keeps the branch-protection name `e2e`.
  e2e-matrix:
    name: e2e (${{ matrix.flags }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # EVERY LEG BLOCKS (WP-3.11).
    #
    # The production leg spent its first weeks as `continue-on-error: true`
    # because it landed with seven failures inherited from the years this
    # configuration was never executed. They are repaired: five in
    # `run-flow.spec` (a first keypress dispatched before the board's listener
    # existed, a forced tap on a disabled LAUNCH, and an assertion that WP-1.04
    # had made obsolete), one in `auth.spec` (the bottom nav rail overflowed a
    # 320px viewport and put the account chip off screen - a real defect, fixed
    # in `Navigation.tsx`), and one in `share-artifacts.spec` (a challenge link
    # followed as a client transition lost its seed - also a real defect, fixed
    # in `ArtifactLanding.tsx`).
    #
    # Reporting-only was the right call while the list was unbounded. It is
    # bounded now, so a red production leg means the shipped configuration is
    # broken and must stop the PR.
    strategy:
      fail-fast: false
      matrix:
        # NOT `[off, on]`: YAML 1.1 parsers - GitHub's among them - coerce bare
        # `off`/`on` to booleans, which would render as "false"/"true" in the
        # expression below, match neither branch, and silently mis-arm the jobs
        # with flags off. That is precisely the bug this job exists to fix.
        flags:
          [rollback, legacy-workbench, genome-without-workbench, production]
    env:
      # The isolated database applies every migration, including FTUE v2's
      # bootstrap RPC, before the production build starts. These two are
      # production defaults on every flag leg (CLAUDE.md).
      NEXT_PUBLIC_FTUE_V2: "true"
      NEXT_PUBLIC_HUD_COCKPIT_V1: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      # Must run before `npm run build`: NEXT_PUBLIC_* are inlined at build
      # time, so a flag exported after the build has no effect at all.
      - name: Arm feature flags for this leg
        run: |
          if [ "${{ matrix.flags }}" = 'rollback' ]; then
            echo 'rollback leg: no NEXT_PUBLIC_* armed, flag-off paths covered'
            exit 0
          fi
          if [ "${{ matrix.flags }}" = 'legacy-workbench' ]; then
            echo 'NEXT_PUBLIC_WORKBENCH_V1=true' >> "$GITHUB_ENV"
            echo 'legacy Workbench leg: Genome v2 off, Workbench v1 on'
            exit 0
          fi
          if [ "${{ matrix.flags }}" = 'genome-without-workbench' ]; then
            node scripts/production-public-surface-cli.mjs github-env \
              | grep -v '^NEXT_PUBLIC_WORKBENCH_V1=' \
              >> "$GITHUB_ENV"
            echo 'Workbench rollback leg: Genome v2 on, Workbench v1 off'
            exit 0
          fi
          # This is the same checked-in contract the release workflow injects
          # into Preview and Production. Adding or removing a live public
          # surface changes one manifest and its deterministic hash rather than
          # silently drifting CI from the artifact players receive.
          node scripts/production-public-surface-cli.mjs github-env >> "$GITHUB_ENV"
          echo 'production leg: exact checked-in public-surface contract armed'

      - name: Install dependencies
        run: npm ci

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Start isolated Supabase
        run: |
          supabase start --exclude realtime,storage-api,imgproxy,postgres-meta,studio,edge-runtime,logflare,vector,supavisor,mailpit
          # `status --output env` shell-quotes every value. Appending that
          # output directly makes the quotes part of GitHub Actions values and
          # produces an invalid Supabase URL during `next build`. Export only
          # the three required fields from JSON, without shell quoting.
          supabase status --output json \
            | jq -r '
                "NEXT_PUBLIC_SUPABASE_URL=\(.API_URL)",
                "NEXT_PUBLIC_SUPABASE_ANON_KEY=\(.ANON_KEY)",
                "SUPABASE_SERVICE_ROLE_KEY=\(.SERVICE_ROLE_KEY)"
              ' \
            >> "$GITHUB_ENV"

      - name: Build (production)
        run: npm run build

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      # playwright.config.ts starts `npm run start` (serves the build above)
      - name: Run e2e tests (excluding @stripe)
        run: |
          if [ "${{ matrix.flags }}" = 'legacy-workbench' ] || [ "${{ matrix.flags }}" = 'genome-without-workbench' ]; then
            npx playwright test e2e/lexicon.spec.ts --grep "a signed-out visitor reaches one coherent research destination"
          else
            npx playwright test --grep-invert "@stripe"
          fi
        env:
          CI: "true"

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.flags }}
          path: playwright-report/
          retention-days: 7

      - name: Stop isolated Supabase
        if: always()
        run: supabase stop --no-backup

  # The required check. Named `e2e` so branch protection keeps working
  # unchanged; it now means "every leg passed" rather than "the flag-off leg
  # passed". `if: always()` is deliberate - without it this job would be
  # SKIPPED when a leg fails, and a skipped required check does not report a
  # failure, so a red matrix would merge.
  e2e:
    needs: [sql-contracts, e2e-matrix]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every e2e leg to pass
        run: |
          sql_result='${{ needs.sql-contracts.result }}'
          e2e_result='${{ needs.e2e-matrix.result }}'
          if [ "$sql_result" != 'success' ] || [ "$e2e_result" != 'success' ]; then
            echo "::error::SQL contracts=$sql_result, e2e matrix=$e2e_result - every isolated gate must pass"
            exit 1
          fi
          echo 'SQL contracts and all e2e flag shapes passed'
