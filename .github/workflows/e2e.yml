# End-to-end tests (Playwright, chromium)
#
# CI starts an isolated local Supabase stack and applies every migration.
# Tests must never create anonymous users or gameplay rows in production.
#
# @stripe-tagged tests (real Stripe checkout) are always excluded here;
# run them locally with E2E_STRIPE=1 npx playwright test --grep @stripe

name: E2E

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The isolated database applies every migration, including FTUE v2's
      # bootstrap RPC, before the production build starts.
      NEXT_PUBLIC_FTUE_V2: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Start isolated Supabase
        run: |
          supabase start --exclude realtime,storage-api,imgproxy,postgres-meta,studio,edge-runtime,logflare,vector,supavisor,mailpit
          supabase status --output env \
            --override-name api.url=NEXT_PUBLIC_SUPABASE_URL \
            --override-name auth.anon_key=NEXT_PUBLIC_SUPABASE_ANON_KEY \
            --override-name auth.service_role_key=SUPABASE_SERVICE_ROLE_KEY \
            >> "$GITHUB_ENV"

      - name: Build (production)
        run: npm run build

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      # playwright.config.ts starts `npm run start` (serves the build above)
      - name: Run e2e tests (excluding @stripe)
        run: npx playwright test --grep-invert "@stripe"
        env:
          CI: 'true'

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Stop isolated Supabase
        if: always()
        run: supabase stop --no-backup
