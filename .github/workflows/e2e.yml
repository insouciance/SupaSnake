# End-to-end tests (Playwright, chromium)
#
# Required repository secrets:
#   NEXT_PUBLIC_SUPABASE_URL    - Supabase project URL (same as build.yml)
#   NEXT_PUBLIC_SUPABASE_ANON_KEY - Supabase anon key
#   SUPABASE_SERVICE_ROLE_KEY   - service-role key (API routes use it at runtime)
# Optional secrets:
#   STRIPE_SECRET_KEY           - Stripe TEST-mode key. Without it the
#                                 anonymous-checkout 403 test self-skips
#                                 (route answers 503 payments-not-configured).
#
# @stripe-tagged tests (real Stripe checkout) are always excluded here;
# run them locally with E2E_STRIPE=1 npx playwright test --grep @stripe

name: E2E

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (production)
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      # playwright.config.ts starts `npm run start` (serves the build above)
      - name: Run e2e tests (excluding @stripe)
        run: npx playwright test --grep-invert "@stripe"
        env:
          CI: 'true'
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
