# End-to-end tests (Playwright, chromium)
#
# CI starts an isolated local Supabase stack and applies every migration.
# Tests must never create anonymous users or gameplay rows in production.
#
# @stripe-tagged tests (real Stripe checkout) are always excluded here;
# run them locally with E2E_STRIPE=1 npx playwright test --grep @stripe

name: E2E

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  merge_group:

jobs:
  sql-contracts:
    name: isolated SQL contracts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # Before anything opens a socket. See scripts/isolated-supabase.sh: the
      # stack's ports live inside the kernel's ephemeral range, so an outbound
      # connection can be handed one of them moments before Docker publishes it.
      - name: Reserve the isolated Supabase ports
        run: bash scripts/isolated-supabase.sh reserve-ports
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1
      - name: Start clean isolated Supabase
        run: |
          bash scripts/isolated-supabase.sh start
          supabase db reset --local
      - name: Run ordinary and two-connection SQL contracts
        run: bash scripts/run-local-sql-contracts.sh
      - name: Stop isolated Supabase
        if: always()
        run: supabase stop --no-backup

  # FOUR FLAG SHAPES: two full suites plus two narrow independent rollbacks.
  #
  # Until 2026-07-27 this job passed no NEXT_PUBLIC_* flag at all, so every
  # flag-split spec ran its flag-OFF branch - while production runs all of them
  # ON. The shipped path had jest coverage and no browser coverage whatsoever.
  # CLAUDE.md already warned about this ("test rollback paths deliberately;
  # never let CI infer them from an omitted flag"); this is that failure in the
  # other direction, where the inferred branch was the one players don't get.
  #
  # `rollback` keeps historical all-off coverage. `production` mirrors the live
  # environment. Workbench and Genome have independent rollback switches, so
  # their two mixed states run the focused public Research journey. The
  # aggregate job below keeps the branch-protection name `e2e`.
  #
  # THE MATRIX. Every leg's flag state comes from ONE source, the checked-in
  # manifest `config/production-public-surface.json` (24 flags as of LF-B,
  # which added `NEXT_PUBLIC_SNAKE_COSMETICS`). The production leg arms it as
  # written; the off legs arm its exact mirror image. Neither list is
  # maintained here, so a new flag cannot reach the production leg and miss
  # the rollback one — the drift this table used to invite. Do not add flag
  # names to this file.
  #
  #   leg                       | curriculum | career spine | genome v2 | specs
  #   --------------------------|------------|--------------|-----------|-------
  #   rollback                  | OFF        | OFF          | OFF       | all
  #   legacy-workbench          | OFF        | OFF          | OFF       | lexicon
  #   genome-without-workbench  | ON         | ON           | ON        | lexicon
  #   production                | ON         | ON           | ON        | all
  #
  # OFF means pinned `=false`, never absent. Both states of every flag are
  # proved by legs that run the WHOLE suite, which is why no fifth leg was
  # added for the curriculum axis:
  #
  # The career-spine column is the one PR #84 asked to be written down: every
  # curriculum surface reads synced attention state, which NotificationProvider
  # does not fetch with `NEXT_PUBLIC_CAREER_SPINE_V1` off — so a curriculum-on
  # leg without it would be a green no-op. Both come from the same manifest on
  # both ON legs, so they cannot drift apart.
  #
  # The handoff's §6c sketch of "curriculum on/off x Genome v2 on/off" is NOT
  # implemented as four literal legs, because two of its cells do not exist:
  # the whole eligibility composition is nested inside `if (GENOME_V2_ENABLED)`
  # (`session/route.ts:1297`), so "curriculum on, Genome v2 off" is definitionally
  # inert and a leg for it would prove nothing at a cost of ~30 CI minutes.
  # The two states that reach a player are covered, each by a full-suite leg.
  e2e-matrix:
    name: e2e (${{ matrix.flags }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # EVERY LEG BLOCKS (WP-3.11).
    #
    # The production leg spent its first weeks as `continue-on-error: true`
    # because it landed with seven failures inherited from the years this
    # configuration was never executed. They are repaired: five in
    # `run-flow.spec` (a first keypress dispatched before the board's listener
    # existed, a forced tap on a disabled LAUNCH, and an assertion that WP-1.04
    # had made obsolete), one in `auth.spec` (the bottom nav rail overflowed a
    # 320px viewport and put the account chip off screen - a real defect, fixed
    # in `Navigation.tsx`), and one in `share-artifacts.spec` (a challenge link
    # followed as a client transition lost its seed - also a real defect, fixed
    # in `ArtifactLanding.tsx`).
    #
    # Reporting-only was the right call while the list was unbounded. It is
    # bounded now, so a red production leg means the shipped configuration is
    # broken and must stop the PR.
    strategy:
      fail-fast: false
      matrix:
        # NOT `[off, on]`: YAML 1.1 parsers - GitHub's among them - coerce bare
        # `off`/`on` to booleans, which would render as "false"/"true" in the
        # expression below, match neither branch, and silently mis-arm the jobs
        # with flags off. That is precisely the bug this job exists to fix.
        flags:
          [rollback, legacy-workbench, genome-without-workbench, production]
    env:
      # The isolated database applies every migration, including FTUE v2's
      # bootstrap RPC, before the production build starts. These two are
      # production defaults on every flag leg (CLAUDE.md).
      NEXT_PUBLIC_FTUE_V2: "true"
      NEXT_PUBLIC_HUD_COCKPIT_V1: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # First, deliberately: `npm ci`, the Playwright download and the Supabase
      # image pull all open outbound connections, and the kernel draws their
      # source ports from a range that contains 54320-54322. The reservation
      # only governs assignments made after it runs.
      - name: Reserve the isolated Supabase ports
        run: bash scripts/isolated-supabase.sh reserve-ports

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      # Must run before `npm run build`: NEXT_PUBLIC_* are inlined at build
      # time, so a flag exported after the build has no effect at all.
      - name: Arm feature flags for this leg
        run: |
          # EVERY OFF STATE IS PINNED, NEVER OMITTED (CLAUDE.md).
          #
          # These legs used to arm nothing and let the absent flag mean "off".
          # That is only true while every flag is read with `=== 'true'`: the
          # first one written as `!== 'false'` would flip its rollback leg to
          # the ON path, and the leg would pass having tested the shipped
          # configuration a second time. `github-env-off` derives the off
          # state from the SAME manifest the production leg arms from, so a
          # new flag cannot land on one leg and miss the other.
          #
          # The two production defaults are excluded because the job-level
          # `env:` already sets them true on every leg.
          DEFAULTS='NEXT_PUBLIC_FTUE_V2 NEXT_PUBLIC_HUD_COCKPIT_V1'
          if [ "${{ matrix.flags }}" = 'rollback' ]; then
            node scripts/production-public-surface-cli.mjs github-env-off $DEFAULTS >> "$GITHUB_ENV"
            echo 'rollback leg: every manifest flag pinned OFF explicitly'
            echo '  curriculum OFF, career spine OFF, Genome v2 OFF; full suite'
            echo '  this is the leg that proves the curriculum rollback path'
            # The production leg fails loudly when its flags are missing; the
            # rollback leg deserves the same treatment in the other direction.
            # A rollback leg that quietly armed a flag ON would prove nothing
            # and look identical in the log.
            for required in NEXT_PUBLIC_PLAYER_EVOLUTION_V1 NEXT_PUBLIC_CAREER_SPINE_V1 NEXT_PUBLIC_GENOME_V2; do
              if ! grep -qx "${required}=false" "$GITHUB_ENV"; then
                echo "::error::rollback leg is missing ${required}=false; the off path would not be under test"
                exit 1
              fi
            done
            exit 0
          fi
          if [ "${{ matrix.flags }}" = 'legacy-workbench' ]; then
            # Excluded from the off list rather than overridden after it, so
            # this flag is assigned exactly once and the leg does not depend
            # on which duplicate $GITHUB_ENV line wins.
            node scripts/production-public-surface-cli.mjs github-env-off \
              $DEFAULTS NEXT_PUBLIC_WORKBENCH_V1 >> "$GITHUB_ENV"
            echo 'NEXT_PUBLIC_WORKBENCH_V1=true' >> "$GITHUB_ENV"
            echo 'legacy Workbench leg: Genome v2 off, Workbench v1 on'
            echo '  curriculum OFF, career spine OFF; focused Research journey'
            exit 0
          fi
          if [ "${{ matrix.flags }}" = 'genome-without-workbench' ]; then
            node scripts/production-public-surface-cli.mjs github-env \
              | grep -v '^NEXT_PUBLIC_WORKBENCH_V1=' \
              >> "$GITHUB_ENV"
            # Pinned, not merely dropped: this leg's whole subject is the
            # Workbench being OFF, so it says so.
            echo 'NEXT_PUBLIC_WORKBENCH_V1=false' >> "$GITHUB_ENV"
            echo 'Workbench rollback leg: Genome v2 on, Workbench v1 off'
            echo '  curriculum ON, career spine ON; focused Research journey'
            echo '  the curriculum is inert here: that journey is signed out'
            exit 0
          fi
          # This is the same checked-in contract the release workflow injects
          # into Preview and Production. Adding or removing a live public
          # surface changes one manifest and its deterministic hash rather than
          # silently drifting CI from the artifact players receive.
          node scripts/production-public-surface-cli.mjs github-env >> "$GITHUB_ENV"
          echo 'production leg: exact checked-in public-surface contract armed'
          echo '  curriculum ON, career spine ON, Genome v2 ON; full suite'
          echo '  this is the leg that proves the curriculum flag-ON path'
          # Fail loudly rather than pass quietly. A curriculum-on leg with the
          # Career Spine off renders none of these surfaces and would go green
          # having tested nothing (PR #84's warning made mechanical).
          for required in NEXT_PUBLIC_PLAYER_EVOLUTION_V1 NEXT_PUBLIC_CAREER_SPINE_V1 NEXT_PUBLIC_GENOME_V2; do
            if ! grep -qx "${required}=true" "$GITHUB_ENV"; then
              echo "::error::production leg is missing ${required}=true; the curriculum journey would be a silent no-op"
              exit 1
            fi
          done

      - name: Install dependencies
        run: npm ci

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Start isolated Supabase
        run: |
          bash scripts/isolated-supabase.sh start
          # `status --output env` shell-quotes every value. Appending that
          # output directly makes the quotes part of GitHub Actions values and
          # produces an invalid Supabase URL during `next build`. Export only
          # the three required fields from JSON, without shell quoting.
          supabase status --output json \
            | jq -r '
                "NEXT_PUBLIC_SUPABASE_URL=\(.API_URL)",
                "NEXT_PUBLIC_SUPABASE_ANON_KEY=\(.ANON_KEY)",
                "SUPABASE_SERVICE_ROLE_KEY=\(.SERVICE_ROLE_KEY)"
              ' \
            >> "$GITHUB_ENV"

      - name: Build (production)
        run: npm run build

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      # playwright.config.ts starts `npm run start` (serves the build above)
      - name: Run e2e tests (excluding @stripe)
        run: |
          if [ "${{ matrix.flags }}" = 'legacy-workbench' ] || [ "${{ matrix.flags }}" = 'genome-without-workbench' ]; then
            npx playwright test e2e/lexicon.spec.ts --grep "a signed-out visitor reaches one coherent research destination"
          else
            npx playwright test --grep-invert "@stripe"
          fi
        env:
          CI: "true"

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.flags }}
          path: playwright-report/
          retention-days: 7

      - name: Stop isolated Supabase
        if: always()
        run: supabase stop --no-backup

  # The required check. Named `e2e` so branch protection keeps working
  # unchanged; it now means "every leg passed" rather than "the flag-off leg
  # passed". `if: always()` is deliberate - without it this job would be
  # SKIPPED when a leg fails, and a skipped required check does not report a
  # failure, so a red matrix would merge.
  e2e:
    needs: [sql-contracts, e2e-matrix]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every e2e leg to pass
        run: |
          sql_result='${{ needs.sql-contracts.result }}'
          e2e_result='${{ needs.e2e-matrix.result }}'
          if [ "$sql_result" != 'success' ] || [ "$e2e_result" != 'success' ]; then
            echo "::error::SQL contracts=$sql_result, e2e matrix=$e2e_result - every isolated gate must pass"
            exit 1
          fi
          echo 'SQL contracts and all e2e flag shapes passed'
