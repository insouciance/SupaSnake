name: Test

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  merge_group:

jobs:
  test:
    runs-on: ubuntu-latest
    # THE CEILING HAD NO HEADROOM LEFT.
    #
    # `npm test -- --coverage --runInBand` on main was finishing at 14m01s,
    # 14m41s, 14m45s and 14m49s against a 15-minute limit — four of the last
    # six runs within a minute of the wall. That is not a suite that passes;
    # it is a suite that has been getting lucky, and the next PR to add a test
    # file was always going to be the one blamed for it. This one was.
    #
    # Raised rather than "fixed" by trimming, because nothing here is broken:
    # the suite is serial by choice (--runInBand keeps the coverage ratchet
    # deterministic) and it grew honestly. If it approaches this ceiling too,
    # the answer is sharding the job, not another number.
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-key
      NEXT_PUBLIC_FTUE_V2: 'true'
      NEXT_PUBLIC_HUD_COCKPIT_V1: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --coverage --runInBand

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage/lcov.info
          fail_ci_if_error: false
