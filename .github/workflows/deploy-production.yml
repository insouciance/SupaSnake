name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type DEPLOY to release the selected commit'
        required: true
        type: string
      payments_mode:
        description: 'Stripe credential mode expected in the production environment'
        required: true
        default: test
        type: choice
        options:
          - test
          - live
      expected_migrations:
        description: 'Exact comma-separated pending migration filenames, or none'
        required: true
        default: none
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  verify:
    if: ${{ inputs.confirmation == 'DEPLOY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-key
    steps:
      - name: Require main branch dispatch
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Production deploys may only be dispatched from main; received $GITHUB_REF"
            exit 1
          fi
      - uses: actions/checkout@v4
      - name: Require the exact current main commit
        run: bash scripts/verify-exact-main.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Arm the exact production public-surface contract
        run: node scripts/production-public-surface-cli.mjs github-env >> "$GITHUB_ENV"
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1
      - name: Start clean isolated Supabase for SQL contracts
        run: |
          supabase start --exclude realtime,storage-api,imgproxy,postgres-meta,studio,edge-runtime,logflare,vector,supavisor,mailpit
          supabase db reset --local
      - name: Run isolated SQL contracts, including two-session races
        run: bash scripts/run-local-sql-contracts.sh
      - name: Stop isolated Supabase
        if: always()
        run: supabase stop --no-backup
      - name: Unit, type, lint, and dependency gates
        run: |
          npm test -- --coverage --runInBand
          npx tsc --noEmit
          npm run lint

      # The dependency gate is split (owner ruling, 25 July 2026).
      #
      # BLOCKING: the dependency tree that actually ships. `--omit=dev` scopes
      # the audit to runtime dependencies, which are the only ones that can
      # reach supasnake.com. A high or critical finding here stops the release.
      #
      # This split was made because the combined audit was failing on 27 high
      # findings of which 26 were jest/eslint/babel and their transitive
      # glob/minimatch chain - build tooling that is never bundled. Clearing
      # those needs breaking major upgrades (`npm audit fix --force`), and a
      # gate that can only be satisfied by an unrelated breaking upgrade stops
      # being a security control and starts being a reason to bypass security
      # controls. The 27th finding was real and reachable
      # (brace-expansion GHSA-mh99-v99m-4gvg) and is patched.
      #
      # Do not widen this back without also fixing the dev tree - and do not
      # narrow it further.
      - name: Dependency gate — production tree (blocking)
        run: npm audit --audit-level=high --omit=dev

      # NON-BLOCKING: the build toolchain. Reported on every release so the
      # debt stays visible and is consciously carried rather than forgotten.
      # If this output ever contains something reachable at runtime, it belongs
      # in the blocking gate above.
      - name: Dependency audit — dev toolchain (reported, non-blocking)
        continue-on-error: true
        run: |
          echo "Dev-dependency audit. Findings here do not ship, but do not ignore them either."
          npm audit --audit-level=high

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      NEXT_PUBLIC_RUN_FLOW_V1: 'true'
    steps:
      - name: Require main branch dispatch
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Production deploys may only be dispatched from main; received $GITHUB_REF"
            exit 1
          fi
      - uses: actions/checkout@v4
      - name: Require the exact current main commit
        run: bash scripts/verify-exact-main.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - name: Load exact production public-surface contract
        id: surface_contract
        run: |
          set -euo pipefail
          node scripts/production-public-surface-cli.mjs github-env >> "$GITHUB_ENV"
          contract=$(node scripts/production-public-surface-cli.mjs json)
          echo "hash=$(printf '%s' "$contract" | jq -er '.contractHash')" >> "$GITHUB_OUTPUT"
          echo "project_ref=$(printf '%s' "$contract" | jq -er '.supabaseProjectRef')" >> "$GITHUB_OUTPUT"

      - name: Require successful exact-SHA push workflows
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-github-sha-workflows.mjs

      - name: Pull production environment
        run: npx vercel@56.3.1 pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Validate production environment contract
        run: >-
          npm run verify:production-env --
          --env-file .vercel/.env.production.local
          --allow-sealed
          --payments-mode "${{ inputs.payments_mode }}"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1
      - name: Link and preview database migrations
        id: migration_plan
        env:
          EXPECTED_MIGRATIONS: ${{ inputs.expected_migrations }}
        run: |
          set -euo pipefail
          if [ "$SUPABASE_PROJECT_ID" != 'gmpwyzqafoyowndbvlma' ]; then
            echo "::error::production project mismatch; refusing $SUPABASE_PROJECT_ID"
            exit 1
          fi
          supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"
          bash scripts/verify-linked-migration-plan.sh
          actual=$(grep '^actual=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2-)

          rollout=''
          if [ -z "$actual" ]; then
            rollout=none
          elif [ "$actual" = '062_competitive_clans.sql,063_run_continuity.sql,064_atomic_dynasty_favorites.sql' ]; then
            rollout=cohesive-ux-initial
          elif [ "$actual" = '063_run_continuity.sql,064_atomic_dynasty_favorites.sql' ] \
              || [ "$actual" = '064_atomic_dynasty_favorites.sql' ]; then
            rollout=cohesive-ux-resume
          elif [[ ",$actual," == *",062_competitive_clans.sql,"* \
              || ",$actual," == *",063_run_continuity.sql,"* \
              || ",$actual," == *",064_atomic_dynasty_favorites.sql,"* ]]; then
            echo "::error::Cohesive UX migrations require the exact initial set or an ordered suffix"
            exit 1
          else
            echo "::error::This release workflow rejects migrations without an explicit reviewed rollout contract: $actual"
            exit 1
          fi
          echo "rollout=$rollout" >> "$GITHUB_OUTPUT"

      - name: Record exact outgoing production deployment
        id: outgoing
        run: |
          set -euo pipefail
          outgoing_json=$(npx vercel@56.3.1 inspect https://supasnake.com \
            --format=json --non-interactive --token="$VERCEL_TOKEN")
          outgoing_id=$(printf '%s' "$outgoing_json" | jq -er '.id')
          outgoing_host=$(printf '%s' "$outgoing_json" | jq -er '.url')
          if ! printf '%s' "$outgoing_json" | jq -e \
            '.readyState == "READY" and .target == "production"' >/dev/null; then
            echo "::error::canonical alias is not a ready production deployment"
            exit 1
          fi
          outgoing_health=$(curl --fail --show-error --silent --max-time 20 \
            https://supasnake.com/api/health)
          if ! printf '%s' "$outgoing_health" | jq -e \
            '.status == "healthy"
              and .checks.database.status == "healthy"
              and (.release | type == "string" and length > 0 and . != "unknown")' >/dev/null; then
            echo "::error::canonical outgoing deployment is not exactly healthy"
            exit 1
          fi
          outgoing_release=$(printf '%s' "$outgoing_health" | jq -er '.release')
          {
            echo "id=$outgoing_id"
            echo "host=$outgoing_host"
            echo "url=https://$outgoing_host"
            echo "release=$outgoing_release"
          } >> "$GITHUB_OUTPUT"
          {
            echo '### Outgoing production anchor'
            echo ''
            echo "Before cutover: \`$outgoing_id\` (\`https://$outgoing_host\`, release \`$outgoing_release\`)"
            echo ''
            echo 'A rollback is never automatic. Use the supported `vercel rollback <deployment>` command only after checking schema compatibility, then prove alias and cron state independently.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Snapshot exact outgoing cron state
        id: cron_before
        env:
          EXPECTED_CRON_DEPLOYMENT_ID: ${{ steps.outgoing.outputs.id }}
          EXPECTED_CRON_HOST: ${{ steps.outgoing.outputs.host }}
        run: bash scripts/verify-vercel-cron-state.sh

      - name: Revalidate exact release authority before Preview creation
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash scripts/verify-exact-main.sh
          node scripts/verify-github-sha-workflows.mjs

      # Preview is an ordinary Preview deployment. Vercel invokes project cron
      # jobs only on Production, so this artifact cannot acquire production
      # cron ownership. It is the sole pre-cutover application artifact.
      - name: Build isolated Preview artifact
        id: preview
        run: |
          set -euo pipefail
          mapfile -t surface_args < <(
            node scripts/production-public-surface-cli.mjs vercel-args
          )
          deployment_url=$(npx vercel@56.3.1 deploy \
            --yes \
            --archive=tgz \
            --build-env EXPECTED_PAYMENTS_MODE="${{ inputs.payments_mode }}" \
            --build-env SUPABASE_SERVICE_ROLE_KEY='preview-disabled-no-service-role' \
            --env SUPABASE_SERVICE_ROLE_KEY='preview-disabled-no-service-role' \
            --env SUPASNAKE_RELEASE_SHA="${{ github.sha }}" \
            "${surface_args[@]}" \
            --token="$VERCEL_TOKEN")
          deployment_json=$(npx vercel@56.3.1 inspect "$deployment_url" \
            --format=json --non-interactive --token="$VERCEL_TOKEN")
          deployment_id=$(printf '%s' "$deployment_json" | jq -er '.id')
          deployment_host=$(printf '%s' "$deployment_json" | jq -er '.url')
          deployment_target=$(printf '%s' "$deployment_json" | jq -r '.target // "preview"')
          if [ "$deployment_target" != 'preview' ] \
              || ! printf '%s' "$deployment_json" | jq -e '.readyState == "READY"' >/dev/null \
              || [ "$deployment_id" = "${{ steps.outgoing.outputs.id }}" ]; then
            echo "::error::preflight artifact is not an isolated READY Preview"
            exit 1
          fi
          {
            echo "url=$deployment_url"
            echo "id=$deployment_id"
            echo "host=$deployment_host"
            echo 'target=preview'
          } >> "$GITHUB_OUTPUT"

      - name: Prove Preview left canonical alias unchanged
        run: |
          set -euo pipefail
          canonical_json=$(npx vercel@56.3.1 inspect https://supasnake.com \
            --format=json --non-interactive --token="$VERCEL_TOKEN")
          if ! printf '%s' "$canonical_json" | jq -e \
            --arg id "${{ steps.outgoing.outputs.id }}" \
            --arg host "${{ steps.outgoing.outputs.host }}" \
            '.id == $id and .url == $host and .readyState == "READY" and .target == "production"' >/dev/null; then
            echo "::error::Preview creation changed the canonical production alias"
            exit 1
          fi
      - name: Prove Preview cannot own production cron
        env:
          EXPECTED_CRON_DEPLOYMENT_ID: ${{ steps.outgoing.outputs.id }}
          EXPECTED_CRON_HOST: ${{ steps.outgoing.outputs.host }}
          EXPECTED_CRON_DEFINITIONS_SHA: ${{ steps.cron_before.outputs.definitions_sha }}
        run: bash scripts/verify-vercel-cron-state.sh

      - name: Smoke Preview public contract before schema mutation
        run: |
          set -uo pipefail
          payload=''
          for attempt in $(seq 1 12); do
            if payload=$(npx vercel@56.3.1 curl /api/release-contract \
                --deployment "${{ steps.preview.outputs.url }}" --yes -- \
                --fail --show-error --silent --max-time 20) \
              && printf '%s' "$payload" | jq -e \
                --arg release "${{ github.sha }}" \
                --arg hash "${{ steps.surface_contract.outputs.hash }}" \
                --arg project "${{ steps.surface_contract.outputs.project_ref }}" \
                '.status == "healthy"
                  and .release == $release
                  and .checks.database.status == "healthy"
                  and .checks.publicSurface.status == "healthy"
                  and .checks.publicSurface.contractHash == $hash
                  and .checks.publicSurface.declaredHash == $hash
                  and .checks.publicSurface.projectRef == $project
                  and .checks.publicSurface.expectedProjectRef == $project
                  and .checks.publicSurface.enabledFlagCount
                    == .checks.publicSurface.expectedFlagCount
                  and (.checks.publicSurface.disabledFlags | length) == 0' >/dev/null; then
              exit 0
            fi
            if [ "$attempt" -lt 12 ]; then sleep 5; fi
          done
          echo "::error::Preview did not prove the exact public release contract"
          printf '%s\n' "$payload"
          exit 1

      - name: Revalidate exact authority and pending plan before schema mutation
        if: ${{ steps.migration_plan.outputs.rollout != 'none' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_MIGRATIONS: ${{ steps.migration_plan.outputs.actual || 'none' }}
        run: |
          set -euo pipefail
          bash scripts/verify-exact-main.sh
          node scripts/verify-github-sha-workflows.mjs
          bash scripts/verify-linked-migration-plan.sh

      - name: Apply cohesive UX bridge migrations
        if: ${{ steps.migration_plan.outputs.rollout == 'cohesive-ux-initial' || steps.migration_plan.outputs.rollout == 'cohesive-ux-resume' }}
        run: supabase db push --linked --include-all --password "$SUPABASE_DB_PASSWORD"
      - name: Validate cohesive UX bridge schema
        if: ${{ steps.migration_plan.outputs.rollout == 'cohesive-ux-initial' || steps.migration_plan.outputs.rollout == 'cohesive-ux-resume' }}
        run: supabase db lint --linked --level warning --fail-on error

      - name: Prove the linked migration plan is empty after the reviewed push
        env:
          EXPECTED_MIGRATIONS: none
        run: bash scripts/verify-linked-migration-plan.sh

      # This is the only SQL test permitted against hosted production. It has
      # no fixtures and is guarded by both Management API read_only=true and
      # BEGIN TRANSACTION READ ONLY in the SQL file.
      - name: Probe linked cohesive schema read-only
        run: bash scripts/probe-linked-cohesive-schema.sh

      - name: Prove bridge push left canonical alias unchanged
        run: |
          set -euo pipefail
          canonical_json=$(npx vercel@56.3.1 inspect https://supasnake.com \
            --format=json --non-interactive --token="$VERCEL_TOKEN")
          if ! printf '%s' "$canonical_json" | jq -e \
            --arg id "${{ steps.outgoing.outputs.id }}" \
            --arg host "${{ steps.outgoing.outputs.host }}" \
            '.id == $id and .url == $host and .readyState == "READY" and .target == "production"' >/dev/null; then
            echo "::error::canonical alias changed before deliberate cutover"
            exit 1
          fi
      - name: Prove bridge push left production cron unchanged
        env:
          EXPECTED_CRON_DEPLOYMENT_ID: ${{ steps.outgoing.outputs.id }}
          EXPECTED_CRON_HOST: ${{ steps.outgoing.outputs.host }}
          EXPECTED_CRON_DEFINITIONS_SHA: ${{ steps.cron_before.outputs.definitions_sha }}
        run: bash scripts/verify-vercel-cron-state.sh

      - name: Verify outgoing application on final bridge schema
        run: |
          set -uo pipefail
          payload=''
          for attempt in $(seq 1 12); do
            if payload=$(curl --fail --show-error --silent --max-time 20 \
                https://supasnake.com/api/health) \
              && printf '%s' "$payload" | jq -e \
                --arg release "${{ steps.outgoing.outputs.release }}" \
                '.status == "healthy"
                  and .release == $release
                  and .checks.database.status == "healthy"' >/dev/null; then
              exit 0
            fi
            if [ "$attempt" -lt 12 ]; then sleep 5; fi
          done
          echo "::error::outgoing production is not healthy on final bridge schema"
          printf '%s\n' "$payload"
          exit 1

      - name: Re-prove exact Preview public contract on final bridge schema
        run: |
          set -uo pipefail
          payload=''
          for attempt in $(seq 1 12); do
            if payload=$(npx vercel@56.3.1 curl /api/release-contract \
                --deployment "${{ steps.preview.outputs.url }}" --yes -- \
                --fail --show-error --silent --max-time 20) \
              && printf '%s' "$payload" | jq -e \
                --arg release "${{ github.sha }}" \
                --arg hash "${{ steps.surface_contract.outputs.hash }}" \
                --arg project "${{ steps.surface_contract.outputs.project_ref }}" \
                '.status == "healthy"
                  and .release == $release
                  and .checks.database.status == "healthy"
                  and .checks.publicSurface.status == "healthy"
                  and .checks.publicSurface.contractHash == $hash
                  and .checks.publicSurface.declaredHash == $hash
                  and .checks.publicSurface.projectRef == $project
                  and .checks.publicSurface.expectedProjectRef == $project
                  and .checks.publicSurface.enabledFlagCount
                    == .checks.publicSurface.expectedFlagCount
                  and (.checks.publicSurface.disabledFlags | length) == 0' >/dev/null; then
              exit 0
            fi
            if [ "$attempt" -lt 12 ]; then sleep 5; fi
          done
          echo "::error::exact Preview lost the public release contract"
          printf '%s\n' "$payload"
          exit 1

      - name: Revalidate exact authority and empty schema plan before Production
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_MIGRATIONS: none
        run: |
          set -euo pipefail
          bash scripts/verify-exact-main.sh
          node scripts/verify-github-sha-workflows.mjs
          bash scripts/verify-linked-migration-plan.sh

      # There is deliberately no --prod --skip-domain artifact. Once every
      # preflight has passed, this single supported Production deployment is
      # allowed to become Current. A failed build never creates an abandoned
      # production staging interval whose cron ownership needs guessing.
      - name: Create deliberate Production deployment and cut over
        id: production_attempt
        run: |
          set -euo pipefail
          echo 'started=true' >> "$GITHUB_OUTPUT"
          mapfile -t surface_args < <(
            node scripts/production-public-surface-cli.mjs vercel-args
          )
          deployment_url=$(npx vercel@56.3.1 deploy \
            --prod \
            --yes \
            --archive=tgz \
            --build-env EXPECTED_PAYMENTS_MODE="${{ inputs.payments_mode }}" \
            --env SUPASNAKE_RELEASE_SHA="${{ github.sha }}" \
            "${surface_args[@]}" \
            --token="$VERCEL_TOKEN")
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Inspect exact Production deployment
        id: production
        run: |
          set -euo pipefail
          deployment_json=$(npx vercel@56.3.1 inspect \
            "${{ steps.production_attempt.outputs.url }}" \
            --format=json --non-interactive --token="$VERCEL_TOKEN")
          deployment_id=$(printf '%s' "$deployment_json" | jq -er '.id')
          deployment_host=$(printf '%s' "$deployment_json" | jq -er '.url')
          if ! printf '%s' "$deployment_json" | jq -e \
            '.readyState == "READY" and .target == "production"' >/dev/null \
              || [ "$deployment_id" = "${{ steps.outgoing.outputs.id }}" ]; then
            echo "::error::new artifact is not a distinct READY Production deployment"
            exit 1
          fi
          {
            echo "id=$deployment_id"
            echo "host=$deployment_host"
          } >> "$GITHUB_OUTPUT"

      - name: Prove canonical alias names exact Production deployment
        run: |
          set -uo pipefail
          canonical_json=''
          for attempt in $(seq 1 12); do
            if canonical_json=$(npx vercel@56.3.1 inspect https://supasnake.com \
                --format=json --non-interactive --token="$VERCEL_TOKEN") \
              && printf '%s' "$canonical_json" | jq -e \
                --arg id "${{ steps.production.outputs.id }}" \
                --arg host "${{ steps.production.outputs.host }}" \
                '.id == $id and .url == $host and .readyState == "READY" and .target == "production"' >/dev/null; then
              exit 0
            fi
            if [ "$attempt" -lt 12 ]; then sleep 5; fi
          done
          echo "::error::canonical alias does not name the exact new Production deployment"
          printf '%s\n' "$canonical_json"
          exit 1

      - name: Prove exact Production deployment owns reviewed cron schedule
        env:
          EXPECTED_CRON_DEPLOYMENT_ID: ${{ steps.production.outputs.id }}
          EXPECTED_CRON_HOST: ${{ steps.production.outputs.host }}
          EXPECTED_CRON_DEFINITIONS_SHA: ${{ steps.cron_before.outputs.definitions_sha }}
        run: bash scripts/verify-vercel-cron-state.sh

      - name: Production health smoke test
        run: |
          set -uo pipefail
          payload=''
          for attempt in $(seq 1 12); do
            if payload=$(curl --fail --show-error --silent --max-time 20 \
                https://supasnake.com/api/health) \
              && printf '%s' "$payload" | jq -e \
                --arg release "${{ github.sha }}" \
                --arg hash "${{ steps.surface_contract.outputs.hash }}" \
                --arg project "${{ steps.surface_contract.outputs.project_ref }}" \
                '.status == "healthy"
                  and .release == $release
                  and .checks.database.status == "healthy"
                  and .checks.publicSurface.status == "healthy"
                  and .checks.publicSurface.contractHash == $hash
                  and .checks.publicSurface.declaredHash == $hash
                  and .checks.publicSurface.projectRef == $project
                  and .checks.publicSurface.expectedProjectRef == $project
                  and .checks.publicSurface.enabledFlagCount
                    == .checks.publicSurface.expectedFlagCount
                  and (.checks.publicSurface.disabledFlags | length) == 0
                  and .checks.careerSpine.status == "healthy"
                  and .checks.careerSpine.phase == "ready"
                  and .checks.careerSpine.bridgeVersion == 1
                  and .checks.careerSpine.careerVersion == 1
                  and .checks.careerSpine.surfaceEnabled == true
                  and .checks.runFlow.status == "healthy"
                  and .checks.runFlow.surfaceEnabled == true
                  and .checks.cohesiveRelease.status == "healthy"
                  and .checks.cohesiveRelease.version == 1
                  and .checks.cohesiveRelease.foundingBridgeVersion == 1
                  and .checks.cohesiveRelease.continuityVersion == 1
                  and .checks.cohesiveRelease.favoriteInvariantVersion == 1' >/dev/null; then
              exit 0
            fi
            if [ "$attempt" -lt 12 ]; then sleep 5; fi
          done
          echo "::error::canonical alias did not converge on exact healthy release"
          printf '%s\n' "$payload"
          exit 1

      # Read-only diagnostics run even when the Production CLI command returns
      # ambiguously. They never mutate aliases or cron configuration. An
      # outgoing/outgoing result is a safe pre-cutover stop; a new or mixed
      # result is an explicit operator incident, not an unsupported auto-fix.
      - name: Classify production state after cutover attempt
        if: ${{ always() && steps.production_attempt.outputs.started == 'true' }}
        env:
          RELEASE_JOB_STATUS: ${{ job.status }}
        run: |
          set -uo pipefail
          canonical_json=$(npx vercel@56.3.1 inspect https://supasnake.com \
            --format=json --non-interactive --token="$VERCEL_TOKEN" 2>/dev/null || true)
          canonical_id=$(printf '%s' "$canonical_json" | jq -r '.id // empty' 2>/dev/null || true)
          canonical_host=$(printf '%s' "$canonical_json" | jq -r '.url // empty' 2>/dev/null || true)
          canonical_ready=$(printf '%s' "$canonical_json" | jq -r '.readyState // empty' 2>/dev/null || true)
          canonical_target=$(printf '%s' "$canonical_json" | jq -r '.target // empty' 2>/dev/null || true)
          health_payload=$(curl --show-error --silent --max-time 20 \
            https://supasnake.com/api/health 2>/dev/null || true)
          live_release=$(printf '%s' "$health_payload" | jq -r '.release // empty' 2>/dev/null || true)
          health_status=$(printf '%s' "$health_payload" | jq -r '.status // empty' 2>/dev/null || true)
          database_status=$(printf '%s' "$health_payload" | jq -r '.checks.database.status // empty' 2>/dev/null || true)
          surface_status=$(printf '%s' "$health_payload" | jq -r '.checks.publicSurface.status // empty' 2>/dev/null || true)
          surface_hash=$(printf '%s' "$health_payload" | jq -r '.checks.publicSurface.contractHash // empty' 2>/dev/null || true)
          surface_project=$(printf '%s' "$health_payload" | jq -r '.checks.publicSurface.projectRef // empty' 2>/dev/null || true)
          project_json=$(curl --fail-with-body --show-error --silent --max-time 20 \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID" 2>/dev/null || true)
          cron_id=$(printf '%s' "$project_json" | jq -r '.crons.deploymentId // empty' 2>/dev/null || true)
          cron_host=$(printf '%s' "$project_json" \
            | jq -r 'if ([.crons.definitions[].host] | unique | length) == 1 then .crons.definitions[0].host else "" end' \
              2>/dev/null || true)
          cron_defs=$(printf '%s' "$project_json" \
            | jq -c '[.crons.definitions[] | {path, schedule}] | sort_by(.path, .schedule)' \
              2>/dev/null || true)
          expected_defs=$(jq -c '[.crons[] | {path, schedule}] | sort_by(.path, .schedule)' vercel.json)
          cron_enabled=$(printf '%s' "$project_json" \
            | jq -r '.crons.enabledAt != null and .crons.disabledAt == null' 2>/dev/null || true)

          echo "canonical=$canonical_id host=$canonical_host ready=$canonical_ready target=$canonical_target release=$live_release health=$health_status database=$database_status cron=$cron_id cron_host=$cron_host enabled=$cron_enabled"
          if [ "$RELEASE_JOB_STATUS" = 'success' ]; then
            exit 0
          fi
          if [ "$canonical_id" = "${{ steps.outgoing.outputs.id }}" ] \
              && [ "$canonical_host" = "${{ steps.outgoing.outputs.host }}" ] \
              && [ "$canonical_ready" = 'READY' ] \
              && [ "$canonical_target" = 'production' ] \
              && [ "$live_release" = "${{ steps.outgoing.outputs.release }}" ] \
              && [ "$health_status" = 'healthy' ] \
              && [ "$database_status" = 'healthy' ] \
              && [ "$cron_id" = "${{ steps.outgoing.outputs.id }}" ] \
              && [ "$cron_host" = "${{ steps.outgoing.outputs.host }}" ] \
              && [ "$cron_defs" = "$expected_defs" ] \
              && [ "$cron_enabled" = 'true' ]; then
            echo "::warning::Production attempt stopped before cutover; canonical application and cron remain exactly outgoing."
            exit 0
          fi
          if [ -n "${{ steps.production.outputs.id }}" ] \
              && [ "$canonical_id" = "${{ steps.production.outputs.id }}" ] \
              && [ "$canonical_host" = "${{ steps.production.outputs.host }}" ] \
              && [ "$canonical_ready" = 'READY' ] \
              && [ "$canonical_target" = 'production' ] \
              && [ "$live_release" = "${{ github.sha }}" ] \
              && [ "$health_status" = 'healthy' ] \
              && [ "$database_status" = 'healthy' ] \
              && [ "$surface_status" = 'healthy' ] \
              && [ "$surface_hash" = "${{ steps.surface_contract.outputs.hash }}" ] \
              && [ "$surface_project" = "${{ steps.surface_contract.outputs.project_ref }}" ] \
              && [ "$cron_id" = "$canonical_id" ] \
              && [ "$cron_host" = "$canonical_host" ] \
              && [ "$cron_defs" = "$expected_defs" ] \
              && [ "$cron_enabled" = 'true' ]; then
            echo "::error::The new release is canonical after a failed workflow step. Stop automation and follow the post-cutover incident procedure; do not promote the outgoing artifact."
            exit 1
          fi
          echo "::error::Ambiguous production/cron state after cutover attempt. Freeze releases and inspect alias, release SHA, cron owner, hosts, definitions, and enabled state manually."
          exit 1
