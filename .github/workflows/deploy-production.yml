name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type DEPLOY to release the selected commit'
        required: true
        type: string
      payments_mode:
        description: 'Stripe credential mode expected in the production environment'
        required: true
        default: test
        type: choice
        options:
          - test
          - live

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  verify:
    if: ${{ inputs.confirmation == 'DEPLOY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-key
      NEXT_PUBLIC_FTUE_V2: 'true'
      NEXT_PUBLIC_HUD_COCKPIT_V1: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Unit, type, lint, and dependency gates
        run: |
          npm test -- --coverage --runInBand
          npx tsc --noEmit
          npm run lint
          npm audit --audit-level=high

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      # The application is deliberately staged before any pending forward-only
      # migration. Every release must document its exact expected migration
      # list; any additional pending migration is a stop condition.
      - name: Pull production environment
        run: npx vercel@56.3.1 pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Validate production environment contract
        run: >-
          npm run verify:production-env --
          --env-file .vercel/.env.production.local
          --allow-sealed
          --payments-mode "${{ inputs.payments_mode }}"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1
      - name: Link and preview database migrations
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"
          supabase db push --linked --include-all --dry-run --password "$SUPABASE_DB_PASSWORD"

      # Sensitive variables are only decrypted inside Vercel's cloud build.
      # Stage and smoke the production-target build before assigning domains.
      - name: Build and stage application in Vercel
        id: app
        run: |
          deployment_url=$(npx vercel@56.3.1 deploy \
            --prod \
            --skip-domain \
            --yes \
            --archive=tgz \
            --build-env EXPECTED_PAYMENTS_MODE="${{ inputs.payments_mode }}" \
            --token="$VERCEL_TOKEN")
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
      - name: Smoke staged application against the current schema
        run: |
          # `vercel curl` v56 forwards an explicit global token option to the
          # underlying curl process. It reads the job's VERCEL_TOKEN environment
          # variable directly, so do not repeat that credential as a CLI flag.
          npx vercel@56.3.1 curl /api/health \
            --deployment "${{ steps.app.outputs.url }}" \
            --yes \
            -- \
            --fail --show-error --silent \
            --retry 6 --retry-delay 5 --retry-all-errors \
            | jq -e '.status == "healthy" and .checks.database.status == "healthy"'
      - name: Promote staged application
        run: >-
          npx vercel@56.3.1 promote
          "${{ steps.app.outputs.url }}"
          --yes
          --token="$VERCEL_TOKEN"

      - name: Apply pending database migrations
        run: supabase db push --linked --include-all --password "$SUPABASE_DB_PASSWORD"
      - name: Validate linked database
        run: supabase db lint --linked --level warning --fail-on error

      - name: Production health smoke test
        run: |
          curl --fail --show-error --silent \
            --retry 6 --retry-delay 5 --retry-all-errors \
            https://supasnake.com/api/health \
            | jq -e '.status == "healthy" and .checks.database.status == "healthy"'
