name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type DEPLOY to release the selected commit'
        required: true
        type: string
      payments_mode:
        description: 'Stripe credential mode expected in the production environment'
        required: true
        default: test
        type: choice
        options:
          - test
          - live
      expected_migrations:
        description: 'Exact comma-separated pending migration filenames, or none'
        required: true
        default: none
        type: string

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  verify:
    if: ${{ inputs.confirmation == 'DEPLOY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-key
      NEXT_PUBLIC_FTUE_V2: 'true'
      NEXT_PUBLIC_HUD_COCKPIT_V1: 'true'
      NEXT_PUBLIC_CAREER_SPINE_V1: 'true'
      NEXT_PUBLIC_RUN_FLOW_V1: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Unit, type, lint, and dependency gates
        run: |
          npm test -- --coverage --runInBand
          npx tsc --noEmit
          npm run lint

      # The dependency gate is split (owner ruling, 25 July 2026).
      #
      # BLOCKING: the dependency tree that actually ships. `--omit=dev` scopes
      # the audit to runtime dependencies, which are the only ones that can
      # reach supasnake.com. A high or critical finding here stops the release.
      #
      # This split was made because the combined audit was failing on 27 high
      # findings of which 26 were jest/eslint/babel and their transitive
      # glob/minimatch chain - build tooling that is never bundled. Clearing
      # those needs breaking major upgrades (`npm audit fix --force`), and a
      # gate that can only be satisfied by an unrelated breaking upgrade stops
      # being a security control and starts being a reason to bypass security
      # controls. The 27th finding was real and reachable
      # (brace-expansion GHSA-mh99-v99m-4gvg) and is patched.
      #
      # Do not widen this back without also fixing the dev tree - and do not
      # narrow it further.
      - name: Dependency gate — production tree (blocking)
        run: npm audit --audit-level=high --omit=dev

      # NON-BLOCKING: the build toolchain. Reported on every release so the
      # debt stays visible and is consciously carried rather than forgotten.
      # If this output ever contains something reachable at runtime, it belongs
      # in the blocking gate above.
      - name: Dependency audit — dev toolchain (reported, non-blocking)
        continue-on-error: true
        run: |
          echo "Dev-dependency audit. Findings here do not ship, but do not ignore them either."
          npm audit --audit-level=high

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      NEXT_PUBLIC_RUN_FLOW_V1: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      # The application is deliberately staged before any pending forward-only
      # migration. Every release must document its exact expected migration
      # list; any additional pending migration is a stop condition.
      - name: Pull production environment
        run: npx vercel@56.3.1 pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Validate production environment contract
        run: >-
          npm run verify:production-env --
          --env-file .vercel/.env.production.local
          --allow-sealed
          --payments-mode "${{ inputs.payments_mode }}"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1
      - name: Link and preview database migrations
        id: migration_plan
        env:
          EXPECTED_MIGRATIONS: ${{ inputs.expected_migrations }}
        run: |
          set -euo pipefail
          if [ "$SUPABASE_PROJECT_ID" != "gmpwyzqafoyowndbvlma" ]; then
            echo "::error::production project mismatch; refusing to link or mutate $SUPABASE_PROJECT_ID"
            exit 1
          fi
          supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"
          preview_file=$(mktemp)
          supabase db push --linked --include-all --dry-run --password "$SUPABASE_DB_PASSWORD" 2>&1 | tee "$preview_file"
          actual=$(grep -oE '[0-9]{3,}_[A-Za-z0-9._-]+\.sql' "$preview_file" | sort -u | paste -sd, - || true)
          expected=$(printf '%s' "$EXPECTED_MIGRATIONS" | tr -d '[:space:]')
          if ! [[ "$expected" =~ ^(none|[0-9]{3,}_[A-Za-z0-9._-]+\.sql(,[0-9]{3,}_[A-Za-z0-9._-]+\.sql)*)$ ]]; then
            echo "::error::expected_migrations must be 'none' or an exact comma-separated migration filename list"
            exit 1
          fi
          if [ "$expected" = "none" ]; then expected=""; fi
          if [ "$actual" != "$expected" ]; then
            echo "::error::pending migrations differ: expected '${expected:-none}', got '${actual:-none}'"
            exit 1
          fi
          rollout=standard
          if [ -z "$actual" ]; then
            rollout=none
          elif [ "$actual" = "060_pending_game_session_ends.sql,061_career_spine.sql" ]; then
            rollout=career-initial
          elif [ "$actual" = "061_career_spine.sql" ]; then
            # Supported forward-only recovery after a prior run committed the
            # additive bridge but stopped before the hard Career migration.
            rollout=career-resume
          elif [[ ",$actual," == *",060_pending_game_session_ends.sql,"* \
              || ",$actual," == *",061_career_spine.sql,"* ]]; then
            echo "::error::Career settlement migrations must be the exact initial or resume set"
            exit 1
          fi
          echo "rollout=$rollout" >> "$GITHUB_OUTPUT"
          echo "actual=$actual" >> "$GITHUB_OUTPUT"

      # Capture the artifact currently behind the canonical alias BEFORE
      # creating a staged production artifact. Listing recent deployments is
      # insufficient because an earlier unpromoted --skip-domain artifact may
      # be newer than the deployment actually serving players.
      - name: Record the outgoing production deployment (rollback anchor)
        run: |
          set -euo pipefail
          outgoing_json=$(npx vercel@56.3.1 inspect https://supasnake.com \
            --format=json --non-interactive --token="$VERCEL_TOKEN")
          outgoing_id=$(printf '%s' "$outgoing_json" | jq -er '.id')
          outgoing_host=$(printf '%s' "$outgoing_json" | jq -er '.url')
          outgoing_ready=$(printf '%s' "$outgoing_json" | jq -er '.readyState')
          outgoing_target=$(printf '%s' "$outgoing_json" | jq -er '.target')
          if [ "$outgoing_ready" != "READY" ] || [ "$outgoing_target" != "production" ]; then
            echo "::error::canonical alias did not resolve to a ready production deployment"
            exit 1
          fi
          outgoing="https://$outgoing_host"
          echo "ROLLBACK ANCHOR (production before this release): $outgoing_id $outgoing"
          {
            echo '### Rollback anchor'
            echo ''
            echo "Production **before** this release: \`$outgoing_id\` (\`$outgoing\`)"
            echo ''
            echo 'Roll back with `vercel promote <that url>`, or via Instant Rollback in the dashboard.'
            echo 'This anchor is not safe after Career bridge traffic has been accepted or migration 061 has committed.'
            echo 'Rollback does NOT revert migrations and does NOT update cron definitions.'
          } >> "$GITHUB_STEP_SUMMARY"

      # Career settlement has a deliberately different boundary from ordinary
      # backward-compatible migrations. 060 only adds the durable server
      # ingress and is safe for the outgoing application. The incoming build
      # is not staged until that bridge exists, because it must never accept an
      # earning result unless it can durably store it first.
      - name: Apply additive Career settlement bridge
        if: ${{ steps.migration_plan.outputs.rollout == 'career-initial' }}
        run: |
          set -euo pipefail
          career_path='supabase/migrations/061_career_spine.sql'
          if [ ! -f 'supabase/migrations/060_pending_game_session_ends.sql' ] \
              || [ ! -f "$career_path" ]; then
            echo "::error::the reviewed 060/061 Career migration pair is incomplete"
            exit 1
          fi
          hold_dir=$(mktemp -d)
          restore_career_migration() {
            if [ -f "$hold_dir/061_career_spine.sql" ]; then
              mv "$hold_dir/061_career_spine.sql" "$career_path"
            fi
            rmdir "$hold_dir" 2>/dev/null || true
          }
          trap restore_career_migration EXIT
          mv "$career_path" "$hold_dir/061_career_spine.sql"
          supabase db push --linked --include-all --password "$SUPABASE_DB_PASSWORD"
          restore_career_migration
          trap - EXIT

      - name: Verify outgoing application after additive bridge
        if: ${{ steps.migration_plan.outputs.rollout == 'career-initial' }}
        run: |
          set -uo pipefail
          payload=''
          for attempt in $(seq 1 12); do
            if payload=$(curl --fail --show-error --silent --max-time 20 \
                https://supasnake.com/api/health) \
              && printf '%s' "$payload" | jq -e \
                '.status == "healthy" and .checks.database.status == "healthy"' >/dev/null; then
              exit 0
            fi
            if [ "$attempt" -lt 12 ]; then sleep 5; fi
          done
          echo "::error::outgoing application is not healthy on the additive bridge"
          printf '%s\n' "$payload"
          exit 1

      - name: Validate additive Career bridge
        if: ${{ steps.migration_plan.outputs.rollout == 'career-initial' }}
        run: supabase db lint --linked --level warning --fail-on error

      # Sensitive variables are only decrypted inside Vercel's cloud build.
      # Stage and smoke the production-target build before assigning domains.
      - name: Build and stage application in Vercel
        id: app
        run: |
          set -euo pipefail
          deployment_url=$(npx vercel@56.3.1 deploy \
            --prod \
            --skip-domain \
            --yes \
            --archive=tgz \
            --build-env EXPECTED_PAYMENTS_MODE="${{ inputs.payments_mode }}" \
            --build-env NEXT_PUBLIC_CAREER_SPINE_V1="true" \
            --build-env NEXT_PUBLIC_RUN_FLOW_V1="true" \
            --env SUPASNAKE_RELEASE_SHA="${{ github.sha }}" \
            --env NEXT_PUBLIC_CAREER_SPINE_V1="true" \
            --env NEXT_PUBLIC_RUN_FLOW_V1="true" \
            --token="$VERCEL_TOKEN")
          deployment_json=$(npx vercel@56.3.1 inspect "$deployment_url" \
            --format=json --non-interactive --token="$VERCEL_TOKEN")
          deployment_id=$(printf '%s' "$deployment_json" | jq -er '.id')
          deployment_ready=$(printf '%s' "$deployment_json" | jq -er '.readyState')
          deployment_target=$(printf '%s' "$deployment_json" | jq -er '.target')
          if [ "$deployment_ready" != 'READY' ] || [ "$deployment_target" != 'production' ]; then
            echo "::error::staged deployment is not a READY production-target artifact"
            exit 1
          fi
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "id=$deployment_id" >> "$GITHUB_OUTPUT"
      - name: Smoke staged application against the current schema
        run: |
          set -uo pipefail
          expected_phase='ready'
          expected_career='1'
          if [ "${{ steps.migration_plan.outputs.rollout }}" = 'career-initial' ] \
              || [ "${{ steps.migration_plan.outputs.rollout }}" = 'career-resume' ]; then
            expected_phase='bridge'
            expected_career='null'
          fi
          # `vercel curl` v56 forwards an explicit global token option to the
          # underlying curl process. It reads the job's VERCEL_TOKEN environment
          # variable directly, so do not repeat that credential as a CLI flag.
          payload=''
          for attempt in $(seq 1 12); do
            if payload=$(npx vercel@56.3.1 curl /api/health \
                --deployment "${{ steps.app.outputs.url }}" \
                --yes \
                -- \
                --fail --show-error --silent --max-time 20) \
              && printf '%s' "$payload" | jq -e --arg release "${{ github.sha }}" \
                  --arg phase "$expected_phase" --arg career "$expected_career" \
                '.status == "healthy"
                  and .checks.database.status == "healthy"
                  and .checks.careerSpine.status == "healthy"
                  and .checks.careerSpine.surfaceEnabled == true
                  and .checks.runFlow.status == "healthy"
                  and .checks.runFlow.surfaceEnabled == true
                  and .checks.careerSpine.bridgeVersion == 1
                  and .checks.careerSpine.phase == $phase
                  and (($career == "null" and .checks.careerSpine.careerVersion == null)
                    or ($career == "1" and .checks.careerSpine.careerVersion == 1))
                  and .release == $release' >/dev/null; then
              exit 0
            fi
            if [ "$attempt" -lt 12 ]; then sleep 5; fi
          done
          echo "::error::staged pre-migration health contract did not become ready"
          printf '%s\n' "$payload"
          exit 1
      - name: Apply standard pending database migrations
        if: ${{ steps.migration_plan.outputs.rollout == 'standard' }}
        run: supabase db push --linked --include-all --password "$SUPABASE_DB_PASSWORD"
      - name: Validate linked database after standard migration
        if: ${{ steps.migration_plan.outputs.rollout == 'standard' }}
        run: supabase db lint --linked --level warning --fail-on error

      - name: Smoke staged application against the standard migrated schema
        if: ${{ steps.migration_plan.outputs.rollout == 'standard' }}
        run: |
          set -uo pipefail
          payload=''
          for attempt in $(seq 1 12); do
            if payload=$(npx vercel@56.3.1 curl /api/health \
                --deployment "${{ steps.app.outputs.url }}" \
                --yes \
                -- \
                --fail --show-error --silent --max-time 20) \
              && printf '%s' "$payload" | jq -e --arg release "${{ github.sha }}" \
                '.status == "healthy"
                  and .checks.database.status == "healthy"
                  and .checks.careerSpine.status == "healthy"
                  and .checks.careerSpine.phase == "ready"
                  and .checks.careerSpine.bridgeVersion == 1
                  and .checks.careerSpine.careerVersion == 1
                  and .checks.careerSpine.surfaceEnabled == true
                  and .checks.runFlow.status == "healthy"
                  and .checks.runFlow.surfaceEnabled == true
                  and .release == $release' >/dev/null; then
              exit 0
            fi
            if [ "$attempt" -lt 12 ]; then sleep 5; fi
          done
          echo "::error::staged post-migration capability did not become ready"
          printf '%s\n' "$payload"
          exit 1
      - name: Smoke outgoing application against the standard migrated schema
        if: ${{ steps.migration_plan.outputs.rollout == 'standard' }}
        run: |
          set -uo pipefail
          payload=''
          for attempt in $(seq 1 12); do
            if payload=$(curl --fail --show-error --silent --max-time 20 \
                https://supasnake.com/api/health) \
              && printf '%s' "$payload" | jq -e \
                '.status == "healthy" and .checks.database.status == "healthy"' >/dev/null; then
              exit 0
            fi
            if [ "$attempt" -lt 12 ]; then sleep 5; fi
          done
          echo "::error::outgoing application is not healthy on the migrated schema"
          printf '%s\n' "$payload"
          exit 1

      - name: Promote staged application
        run: >-
          npx vercel@56.3.1 promote
          "${{ steps.app.outputs.url }}"
          --yes
          --token="$VERCEL_TOKEN"

      - name: Prove canonical alias names the staged deployment
        run: |
          set -euo pipefail
          canonical_json=''
          for attempt in $(seq 1 12); do
            if canonical_json=$(npx vercel@56.3.1 inspect https://supasnake.com \
                --format=json --non-interactive --token="$VERCEL_TOKEN") \
              && canonical_id=$(printf '%s' "$canonical_json" | jq -er '.id') \
              && canonical_ready=$(printf '%s' "$canonical_json" | jq -er '.readyState') \
              && canonical_target=$(printf '%s' "$canonical_json" | jq -er '.target') \
              && [ "$canonical_id" = "${{ steps.app.outputs.id }}" ] \
              && [ "$canonical_ready" = 'READY' ] \
              && [ "$canonical_target" = 'production' ]; then
              exit 0
            fi
            if [ "$attempt" -lt 12 ]; then sleep 5; fi
          done
          echo "::error::canonical alias does not name staged deployment ${{ steps.app.outputs.id }}"
          printf '%s\n' "$canonical_json"
          exit 1

      - name: Prove canonical Career bridge deployment
        if: ${{ steps.migration_plan.outputs.rollout == 'career-initial' || steps.migration_plan.outputs.rollout == 'career-resume' }}
        run: |
          set -uo pipefail
          payload=''
          for attempt in $(seq 1 12); do
            if payload=$(curl --fail --show-error --silent --max-time 20 \
                https://supasnake.com/api/health) \
              && printf '%s' "$payload" | jq -e --arg release "${{ github.sha }}" \
                '.status == "healthy"
                  and .release == $release
                  and .checks.database.status == "healthy"
                  and .checks.careerSpine.status == "healthy"
                  and .checks.careerSpine.phase == "bridge"
                  and .checks.careerSpine.bridgeVersion == 1
                  and .checks.careerSpine.careerVersion == null
                  and .checks.careerSpine.surfaceEnabled == true
                  and .checks.runFlow.status == "healthy"
                  and .checks.runFlow.surfaceEnabled == true' >/dev/null; then
              exit 0
            fi
            if [ "$attempt" -lt 12 ]; then sleep 5; fi
          done
          echo "::error::canonical alias did not converge on the exact Career bridge release"
          printf '%s\n' "$payload"
          exit 1

      # The outgoing canonical settlement function was independently
      # inspected at a 300-second maximum. Start this clock only after the
      # exact bridge build is proven canonical, then include a 60-second
      # margin before 061 rejects the retired absolute writer.
      - name: Drain retired settlement invocations
        if: ${{ steps.migration_plan.outputs.rollout == 'career-initial' || steps.migration_plan.outputs.rollout == 'career-resume' }}
        run: sleep 360

      - name: Re-verify hard Career migration is the only pending change
        if: ${{ steps.migration_plan.outputs.rollout == 'career-initial' || steps.migration_plan.outputs.rollout == 'career-resume' }}
        run: |
          set -euo pipefail
          preview_file=$(mktemp)
          supabase db push --linked --include-all --dry-run --password "$SUPABASE_DB_PASSWORD" 2>&1 | tee "$preview_file"
          actual=$(grep -oE '[0-9]{3,}_[A-Za-z0-9._-]+\.sql' "$preview_file" | sort -u | paste -sd, - || true)
          if [ "$actual" != '061_career_spine.sql' ]; then
            echo "::error::expected only 061_career_spine.sql after the bridge, got '${actual:-none}'"
            exit 1
          fi

      - name: Apply hard Career settlement migration
        if: ${{ steps.migration_plan.outputs.rollout == 'career-initial' || steps.migration_plan.outputs.rollout == 'career-resume' }}
        run: supabase db push --linked --include-all --password "$SUPABASE_DB_PASSWORD"

      - name: Validate linked database after Career cutover
        if: ${{ steps.migration_plan.outputs.rollout == 'career-initial' || steps.migration_plan.outputs.rollout == 'career-resume' }}
        run: supabase db lint --linked --level warning --fail-on error

      - name: Production health smoke test
        run: |
          set -uo pipefail
          payload=''
          for attempt in $(seq 1 12); do
            if payload=$(curl --fail --show-error --silent --max-time 20 \
                https://supasnake.com/api/health) \
              && printf '%s' "$payload" | jq -e --arg release "${{ github.sha }}" \
                '.status == "healthy"
                  and .checks.database.status == "healthy"
                  and .checks.careerSpine.status == "healthy"
                  and .checks.careerSpine.phase == "ready"
                  and .checks.careerSpine.bridgeVersion == 1
                  and .checks.careerSpine.careerVersion == 1
                  and .checks.careerSpine.surfaceEnabled == true
                  and .checks.runFlow.status == "healthy"
                  and .checks.runFlow.surfaceEnabled == true
                  and .release == $release' >/dev/null; then
              exit 0
            fi
            if [ "$attempt" -lt 12 ]; then sleep 5; fi
          done
          echo "::error::canonical alias did not converge on the promoted capability"
          printf '%s\n' "$payload"
          exit 1
